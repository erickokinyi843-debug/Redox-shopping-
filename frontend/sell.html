<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell an Item - RODYX</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root { --navy: #183b56; --teal: #18a999; --coral: #ff6b4a; --page: #eaf4f4; --muted: #607d8b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--page); color: var(--navy); font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }
    header { background: var(--navy); color: #fff; padding: 16px max(20px, calc((100% - 900px) / 2)); display: flex; align-items: center; justify-content: space-between; }
    .logo { color: #fff; font-size: 24px; font-weight: 900; text-decoration: none; }
    .logo i { color: var(--coral); margin-right: 8px; }
    header a:last-child { color: #fff; text-decoration: none; font-size: 14px; }
    main { max-width: 900px; margin: 34px auto; padding: 0 20px; }
    .panel { background: #fff; border-top: 5px solid var(--teal); border-radius: 5px; padding: 28px; box-shadow: 0 5px 18px rgba(24, 59, 86, .12); }
    h1 { margin: 0 0 7px; font-size: 27px; }
    .intro { color: var(--muted); margin: 0 0 23px; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    input, select, textarea { width: 100%; padding: 12px; border: 1px solid #d7e7e8; border-radius: 3px; font: inherit; color: var(--navy); background: #fbfdfd; }
    textarea { min-height: 125px; resize: vertical; }
    .student-listing-toggle { display: flex; align-items: center; gap: 10px; }
    .student-listing-toggle input[type="checkbox"] { flex: 0 0 18px; width: 18px; height: 18px; margin: 0; padding: 0; }
    .student-listing-toggle label { margin: 0; }
    .verification-banner {
      border: 1px solid #ffd9cf; border-left: 5px solid var(--coral); border-radius: 4px; background: #fff7f4; padding: 14px 16px; margin: 0 0 18px; color: var(--navy); line-height: 1.6;
    }
    .verification-banner a { color: var(--coral); font-weight: 800; text-decoration: none; }
    input:focus, select:focus, textarea:focus { outline: 2px solid rgba(24, 169, 153, .25); border-color: var(--teal); }
    .wide { grid-column: 1 / -1; }
    .upload { display: flex; align-items: end; gap: 14px; }
    .upload > div { flex: 1; }
    #preview { display: none; width: 78px; height: 78px; object-fit: cover; border: 2px solid var(--teal); border-radius: 4px; }
    button { border: 0; border-radius: 3px; padding: 12px 22px; color: #fff; background: var(--coral); font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #e95334; }
    button:disabled { opacity: .7; cursor: wait; }
    #message { min-height: 20px; margin: 0; color: var(--coral); font-size: 13px; font-weight: 700; }
    @media (max-width: 600px) { main { margin: 20px auto; } .panel { padding: 20px; } form { grid-template-columns: 1fr; } .wide { grid-column: auto; } .upload { align-items: center; } }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="homepage.html"><i class="fas fa-shopping-bag"></i>RODYX</a>
    <a href="homepage.html"><i class="fas fa-arrow-left"></i> Back to homepage</a>
  </header>
  <main>
    <section class="panel">
      <h1>Sell an item</h1>
      <p class="intro">Add your item details and let shoppers discover it.</p>
      <div class="verification-banner" id="verification-banner"></div>
      <form id="sell-form">
        <div><label for="title">Item name</label><input id="title" name="title" required maxlength="200" placeholder="e.g. Samsung Galaxy A54"></div>
        <div><label for="price">Price (KES)</label><input id="price" name="price" type="number" min="1" required placeholder="25000"></div>
        <div><label for="category">Category</label><select id="category" name="category" required><option value="">Choose a category</option><optgroup label="Student marketplace"><option>Textbooks &amp; Revision Materials</option><option>Laptops &amp; Phones</option><option>Clothes &amp; Shoes</option><option>Furniture &amp; Hostel Essentials</option><option>Calculators &amp; Supplies</option><option>Other Student Essentials</option></optgroup><optgroup label="Other categories"><option>Fashion</option><option>Electronics</option><option>Home</option><option>Sports</option><option>Gaming</option><option>Beauty</option><option>Books</option><option>Food</option></optgroup></select></div>
        <div><label for="town">Town or area (optional)</label><input id="town" name="town" maxlength="80" placeholder="e.g. Chuka"></div>
        <div><label for="business-name">Business name (optional)</label><input id="business-name" name="businessName" maxlength="100" placeholder="Your shop or business"></div>
        <div class="wide student-listing-toggle"><input id="student-marketplace" name="studentMarketplace" type="checkbox"><label for="student-marketplace">Include this item in the Students Marketplace</label></div>
        <div><label for="seller-email">Contact email</label><input id="seller-email" name="sellerEmail" type="email" required></div>
        <div><label for="seller-phone">Contact phone</label><input id="seller-phone" name="sellerPhone" type="tel" required></div>
        <div class="upload"><div><label for="image">Item image (up to 5 MB)</label><input id="image" name="image" type="file" accept="image/*"></div><img id="preview" alt="Selected item preview"></div>
        <div class="wide"><label for="description">Description</label><textarea id="description" name="description" required placeholder="Describe the condition, size, color, and important details"></textarea></div>
        <button class="wide" type="submit"><i class="fas fa-paper-plane"></i> Post item</button>
        <p class="wide" id="message" role="status"></p>
      </form>
    </section>
  </main>
  <script src="config.js"></script>
  <script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!currentUser.email) window.location.href = 'index.html';
    const apiBaseUrl = (window.APP_CONFIG?.apiBaseUrl || '').replace(/\/$/, '');
    const form = document.getElementById('sell-form');
    const imageInput = document.getElementById('image');
    const maxImageSizeBytes = 5 * 1024 * 1024;
    const preview = document.getElementById('preview');
    const message = document.getElementById('message');
    const verificationBanner = document.getElementById('verification-banner');
    const listingsKey = 'rodyxListings';

    function readJSON(key, fallback) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || 'null');
        return value ?? fallback;
      } catch {
        return fallback;
      }
    }

    async function getSellerVerificationStatus(email) {
      if (!apiBaseUrl) throw new Error('The API URL is not configured.');
      const response = await fetch(`${apiBaseUrl}/api/seller-verifications/status?email=${encodeURIComponent(email || '')}`);
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(response.status === 404
        ? 'The deployed API is missing the seller-verification route. Deploy the current backend/app.py and reload the PythonAnywhere web app.'
        : result.error || `The API returned ${response.status}.`);
      return result.status?.status === 'approved' ? result.status : null;
    }

    function getListingCountForSeller(email) {
      const listings = readJSON(listingsKey, []);
      return listings.filter(listing => String(listing.sellerEmail || '').toLowerCase() === String(email || '').toLowerCase()).length;
    }

    async function renderVerificationBanner() {
      let verifiedSeller;
      try {
        verifiedSeller = await getSellerVerificationStatus(currentUser.email);
      } catch (error) {
        verificationBanner.textContent = `Could not check your seller verification status. ${error.message}`;
        return;
      }
      if (verifiedSeller) {
        verificationBanner.innerHTML = '<strong>Verified seller:</strong> Your account is approved. You can post without the default selling restrictions and are shown with a verified badge.';
        return;
      }

      const listingCount = getListingCountForSeller(currentUser.email);
      if (listingCount >= 1) {
        verificationBanner.innerHTML = '<strong>Limited selling access:</strong> Your seller account is still unverified. Please complete verification to unlock full selling benefits and avoid posting limits. <a href="seller-verification.html">Apply now</a>';
        return;
      }

      verificationBanner.innerHTML = '<strong>Seller access:</strong> You are currently unverified. You can post a limited number of listings while your account is under review. <a href="seller-verification.html">Apply for verification</a>';
    }

    document.getElementById('seller-email').value = currentUser.email || '';
    document.getElementById('seller-phone').value = currentUser.phone || '';
    if (new URLSearchParams(window.location.search).get('audience') === 'students') {
      document.getElementById('student-marketplace').checked = true;
    }
    renderVerificationBanner();

    function readImageData(file) {
      if (!file) return Promise.resolve('');
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.addEventListener('load', () => resolve(reader.result));
        reader.addEventListener('error', () => reject(new Error('The selected image could not be read.')));
        reader.readAsDataURL(file);
      });
    }

    function saveListingLocally(listing) {
      try {
        const listings = JSON.parse(localStorage.getItem(listingsKey) || '[]');
        listings.unshift(listing);
        localStorage.setItem(listingsKey, JSON.stringify(listings));
      } catch (error) {
        console.warn('Listing was published, but could not be cached in this browser:', error);
      }
    }

    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (!file) { preview.style.display = 'none'; return; }
      if (file.size > maxImageSizeBytes) {
        imageInput.value = '';
        preview.removeAttribute('src');
        preview.style.display = 'none';
        message.textContent = 'Choose an image no larger than 5 MB.';
        return;
      }
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      message.textContent = '';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const data = new FormData(form);
      const imageFile = imageInput.files[0];
      if (imageFile && imageFile.size > maxImageSizeBytes) {
        message.textContent = 'Choose an image no larger than 5 MB.';
        return;
      }

      let verifiedSeller;
      try {
        verifiedSeller = await getSellerVerificationStatus(currentUser.email);
      } catch (error) {
        message.textContent = `Could not check your seller verification status. ${error.message}`;
        return;
      }
      if (!verifiedSeller && getListingCountForSeller(currentUser.email) >= 1) {
        message.textContent = 'This seller account is still unverified and has reached the posting limit. Please complete verification to continue selling.';
        return;
      }

      const listing = {
        id: `listing-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        createdAt: new Date().toISOString(),
        title: data.get('title'),
        price: data.get('price'),
        category: data.get('category'),
        town: data.get('town').trim(),
        businessName: data.get('businessName').trim(),
        studentMarketplace: data.get('studentMarketplace') === 'on',
        description: data.get('description'),
        image: await readImageData(imageFile),
        sellerName: currentUser.fullname,
        sellerEmail: data.get('sellerEmail').trim(),
        sellerPhone: data.get('sellerPhone').trim(),
        sellerVerified: Boolean(verifiedSeller),
        verificationStatus: verifiedSeller ? 'Verified seller' : 'Unverified seller'
      };
      const button = form.querySelector('button');
      button.disabled = true;
      button.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Posting...';
      try {
        const response = await fetch(`${apiBaseUrl}/api/listings`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ...listing,
            price: Number(listing.price),
            image: listing.image || ''
          })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(response.status === 404
            ? 'The deployed API is missing the listing route. Deploy the current backend/app.py and reload the PythonAnywhere web app.'
            : errorData.error || `The listing API returned ${response.status}.`);
        }

        saveListingLocally(listing);
        message.textContent = 'Your item was posted successfully.';
      } catch (error) {
        message.textContent = `Your listing was not posted. ${error.message || 'Check the API connection and try again.'}`;
        console.error('Listing submission failed:', error);
      } finally {
        form.reset();
        preview.removeAttribute('src');
        preview.style.display = 'none';
        renderVerificationBanner();
        button.disabled = false;
        button.innerHTML = '<i class="fas fa-paper-plane"></i> Post item';
      }
    });
  </script>
</body>
</html>
