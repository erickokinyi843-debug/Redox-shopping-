<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - CHUKA RODYX SHOP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --navy: #183b56;
      --teal: #18a999;
      --coral: #ff6b4a;
      --page: #edf5f5;
      --muted: #607d8b;
      --line: #dfe9eb;
      --card: #ffffff;
      --shadow: rgba(24, 59, 86, 0.12);
      --soft: #f5fafb;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--navy);
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    }

    header {
      background: var(--navy);
      color: #fff;
      padding: 16px max(20px, calc((100% - 1200px) / 2));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo { color: #fff; text-decoration: none; font-size: 24px; font-weight: 900; }
    .logo i { color: var(--coral); margin-right: 8px; }
    .back-link {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    main {
      max-width: 1200px;
      margin: 34px auto;
      padding: 0 20px 40px;
    }

    .chat-shell {
      display: grid;
      grid-template-columns: 320px 1fr;
      min-height: 70vh;
      background: var(--card);
      border-radius: 8px;
      box-shadow: 0 8px 22px var(--shadow);
      overflow: hidden;
      border: 1px solid var(--line);
    }

    .sidebar {
      background: var(--soft);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .sidebar-header h1 {
      margin: 0;
      font-size: 24px;
    }

    .threads {
      display: flex;
      flex-direction: column;
      overflow: auto;
    }

    .thread {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line);
      padding: 14px 16px;
      text-align: left;
      color: var(--navy);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .thread:hover, .thread.active {
      background: #edf9f8;
    }

    .thread-name {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .thread-preview {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .thread-unread {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      border-radius: 999px;
      background: var(--coral);
      color: white;
      font-size: 11px;
      font-weight: 800;
      margin-left: 8px;
      vertical-align: middle;
    }

    .chat-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chat-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      font-weight: 800;
      font-size: 20px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #fdfefe;
    }

    .message-row {
      display: flex;
    }

    .message-row.me {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(78%, 480px);
      padding: 10px 12px;
      border-radius: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message-row.me .bubble {
      background: var(--teal);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message-row.other .bubble {
      background: #eef4f5;
      color: var(--navy);
      border-bottom-left-radius: 4px;
    }

    .message-meta {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 5px;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 16px 20px;
      background: #fff;
      display: flex;
      gap: 12px;
    }

    .composer input {
      flex: 1;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font: inherit;
      color: var(--navy);
    }

    .composer button {
      border: none;
      border-radius: 6px;
      background: var(--coral);
      color: #fff;
      font: inherit;
      font-weight: 800;
      padding: 12px 18px;
      cursor: pointer;
    }

    .composer button:hover { background: #e95334; }

    .empty-state {
      display: grid;
      place-items: center;
      min-height: 200px;
      color: var(--muted);
      text-align: center;
      line-height: 1.6;
      padding: 20px;
    }

    @media (max-width: 760px) {
      .chat-shell {
        grid-template-columns: 1fr;
      }
      .sidebar {
        border-right: none;
        border-bottom: 1px solid var(--line);
      }
      .bubble { max-width: 88%; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="homepage.html"><i class="fas fa-shopping-bag"></i>RODYX</a>
    <a class="back-link" href="homepage.html"><i class="fas fa-arrow-left"></i> Back to homepage</a>
  </header>

  <main>
    <div class="chat-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>Messages</h1>
        </div>
        <div id="threads" class="threads" aria-live="polite"></div>
      </aside>

      <section class="chat-panel">
        <div id="chat-header" class="chat-header">Select a conversation</div>
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <input id="message-input" type="text" maxlength="500" placeholder="Type your message..." autocomplete="off">
          <button type="submit">Send</button>
        </form>
      </section>
    </div>
  </main>

  <script src="config.js"></script>
  <script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!currentUser.email || !currentUser.token) window.location.href = 'index.html';

    const apiBaseUrl = (window.APP_CONFIG?.apiBaseUrl || '').replace(/\/$/, '');
    const threadsEl = document.getElementById('threads');
    const messagesEl = document.getElementById('messages');
    const chatHeaderEl = document.getElementById('chat-header');
    const composer = document.getElementById('composer');
    const input = document.getElementById('message-input');
    let threads = [];
    let activeThreadId = '';

    async function requestMessages(path, options = {}) {
      const response = await fetch(`${apiBaseUrl}${path}`, {
        ...options,
        headers: {
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
          Authorization: `Bearer ${currentUser.token}`,
          ...options.headers
        },
        cache: 'no-store'
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || `The message service returned HTTP ${response.status}.`);
      return result;
    }

    function emptyState(text) {
      const state = document.createElement('div');
      state.className = 'empty-state';
      state.textContent = text;
      return state;
    }

    function getOtherParticipant(thread) {
      return thread.participants.find(email => email !== currentUser.email) || 'Unknown person';
    }

    function participantName(thread, email) {
      if (email === currentUser.email) return currentUser.fullname || 'You';
      const name = thread.names?.[email];
      if (name && !name.includes('@')) return name;
      return email === 'support@rodyx.local' ? 'CHUKA RODYX SHOP Support' : 'Community member';
    }

    function renderMessages(thread) {
      messagesEl.replaceChildren();
      if (!thread) {
        chatHeaderEl.textContent = 'Select a conversation';
        messagesEl.appendChild(emptyState('Choose a conversation or contact support for help.'));
        return;
      }

      const otherEmail = getOtherParticipant(thread);
      chatHeaderEl.textContent = participantName(thread, otherEmail);
      if (!thread.messages?.length) {
        messagesEl.appendChild(emptyState('Say hello and start the conversation.'));
        return;
      }

      thread.messages.forEach(message => {
        const row = document.createElement('div');
        const isMine = message.sender === currentUser.email;
        row.className = `message-row ${isMine ? 'me' : 'other'}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const text = document.createElement('div');
        text.textContent = message.text;
        const meta = document.createElement('div');
        meta.className = 'message-meta';
        meta.textContent = `${participantName(thread, message.sender)} · ${new Date(message.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
        bubble.append(text, meta);
        row.appendChild(bubble);
        messagesEl.appendChild(row);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function renderThreads() {
      threadsEl.replaceChildren();
      if (!threads.length) {
        threadsEl.appendChild(emptyState('No conversations yet. Contact a seller or ask support for help.'));
        renderMessages(null);
        return;
      }

      if (!threads.some(thread => thread.id === activeThreadId)) activeThreadId = threads[0].id;
      threads.forEach(thread => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `thread${thread.id === activeThreadId ? ' active' : ''}`;
        const name = document.createElement('div');
        name.className = 'thread-name';
        name.textContent = participantName(thread, getOtherParticipant(thread));
        const preview = document.createElement('div');
        preview.className = 'thread-preview';
        preview.textContent = thread.messages?.slice(-1)[0]?.text || 'No messages yet';
        button.append(name, preview);
        button.addEventListener('click', () => {
          activeThreadId = thread.id;
          loadThreads().catch(error => {
            chatHeaderEl.textContent = `Could not load conversation: ${error.message}`;
          });
        });
        threadsEl.appendChild(button);
      });
      renderMessages(threads.find(thread => thread.id === activeThreadId));
    }

    async function loadThreads() {
      threads = await requestMessages('/api/messages');
      if (!threads.some(thread => thread.id === activeThreadId)) activeThreadId = threads[0]?.id || '';
      const activeThread = threads.find(thread => thread.id === activeThreadId);
      if (activeThread) {
        const updatedThread = await requestMessages(`/api/messages/${encodeURIComponent(activeThread.id)}/read`, { method: 'POST' });
        threads = threads.map(thread => thread.id === updatedThread.id ? updatedThread : thread);
      }
      renderThreads();
    }

    async function openThread(contactEmail, isSupport) {
      const body = isSupport ? { support: true, text: '' } : { recipient: contactEmail, text: '' };
      const thread = await requestMessages('/api/messages', {
        method: 'POST',
        body: JSON.stringify(body)
      });
      activeThreadId = thread.id;
      await loadThreads();
    }

    composer.addEventListener('submit', async event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const thread = threads.find(item => item.id === activeThreadId);
      if (!thread) return;
      const payload = thread.support
        ? { support: true, text }
        : { recipient: getOtherParticipant(thread), text };
      const sendButton = composer.querySelector('button');
      sendButton.disabled = true;
      try {
        await requestMessages('/api/messages', { method: 'POST', body: JSON.stringify(payload) });
        input.value = '';
        await loadThreads();
      } catch (error) {
        chatHeaderEl.textContent = `Message could not be sent: ${error.message}`;
      } finally {
        sendButton.disabled = false;
      }
    });

    (async () => {
      const params = new URLSearchParams(window.location.search);
      const pendingContact = (() => {
        try {
          return JSON.parse(sessionStorage.getItem('rodyxPendingMessage') || 'null');
        } catch {
          return null;
        }
      })();
      sessionStorage.removeItem('rodyxPendingMessage');
      const contactEmail = params.get('contact') || pendingContact?.email || '';
      try {
        if (contactEmail) {
          await openThread(contactEmail, contactEmail === 'support');
        } else {
          await loadThreads();
        }
      } catch (error) {
        threadsEl.replaceChildren(emptyState(`Could not load messages. ${error.message}`));
        renderMessages(null);
      }
      window.setInterval(() => loadThreads().catch(error => {
        chatHeaderEl.textContent = `Could not refresh messages: ${error.message}`;
      }), 5000);
    })();
  </script>
</body>
</html>
