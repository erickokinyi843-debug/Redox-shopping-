<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Verification - CHUKA RODYX SHOP</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      --navy: #183b56;
      --teal: #18a999;
      --coral: #ff6b4a;
      --page: #edf5f5;
      --muted: #607d8b;
      --line: #dfe9eb;
      --card: #ffffff;
      --shadow: rgba(24, 59, 86, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--navy);
      font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
    }
    header {
      background: var(--navy);
      color: #fff;
      padding: 16px max(20px, calc((100% - 1100px) / 2));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .logo { color: #fff; text-decoration: none; font-size: 24px; font-weight: 900; }
    .logo i { color: var(--coral); margin-right: 8px; }
    .back-link { color: #fff; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 7px; }
    main { max-width: 900px; margin: 34px auto; padding: 0 20px 40px; }
    .panel {
      background: var(--card);
      border-top: 5px solid var(--teal);
      border-radius: 6px;
      box-shadow: 0 8px 20px var(--shadow);
      padding: 28px;
    }
    h1 { margin: 0 0 6px; font-size: 30px; }
    .intro { margin: 0 0 24px; color: var(--muted); line-height: 1.6; }
    form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .wide { grid-column: 1 / -1; }
    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    input, textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 4px;
      font: inherit;
      color: var(--navy);
      background: #fbfdfd;
    }
    textarea { min-height: 140px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid rgba(24,169,153,.18); border-color: var(--teal); }
    button {
      border: none;
      border-radius: 4px;
      background: var(--coral);
      color: #fff;
      font: inherit;
      font-weight: 800;
      padding: 12px 20px;
      cursor: pointer;
    }
    button:hover { background: #e95334; }
    .status-box {
      background: #f4fbfa;
      border: 1px solid var(--line);
      border-left: 5px solid var(--teal);
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 18px;
      color: var(--navy);
      line-height: 1.6;
    }
    .status-box strong { color: var(--navy); }
    #message {
      min-height: 20px;
      margin: 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--coral);
    }
    @media (max-width: 700px) {
      form { grid-template-columns: 1fr; }
      .panel { padding: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="homepage.html"><i class="fas fa-shopping-bag"></i>RODYX</a>
    <a class="back-link" href="sell.html"><i class="fas fa-arrow-left"></i> Back to selling</a>
  </header>
  <main>
    <section class="panel">
      <h1>Seller verification</h1>
      <p class="intro">Submit your details and supporting document for admin review. Verified sellers get a trusted badge and better selling access.</p>
      <div class="status-box" id="status-box"></div>
      <form id="verification-form">
        <div>
          <label for="full-name">Full name</label>
          <input id="full-name" name="fullName" type="text" required>
        </div>
        <div>
          <label for="shop-name">Business or shop name (optional)</label>
          <input id="shop-name" name="shopName" type="text" placeholder="My shop">
        </div>
        <div>
          <label for="phone-number">Phone number</label>
          <input id="phone-number" name="phone" type="tel" required>
        </div>
        <div>
          <label for="email-address">Email</label>
          <input id="email-address" name="email" type="email" required>
        </div>
        <div class="wide">
          <label for="document-upload">Upload supporting document</label>
          <input id="document-upload" name="document" type="file" accept="image/jpeg,image/png,image/gif,image/webp,.pdf" required>
        </div>
        <div class="wide">
          <label for="notes">Why do you want to sell on the platform?</label>
          <textarea id="notes" name="notes" required placeholder="Tell us about your products, service, or student selling status."></textarea>
        </div>
        <button class="wide" type="submit">Submit verification request</button>
        <p class="wide" id="message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="config.js"></script>
  <script>
    const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
    if (!currentUser.email) window.location.href = 'index.html';

    const apiBaseUrl = (window.APP_CONFIG?.apiBaseUrl || '').replace(/\/$/, '');
    const maxDocumentSizeBytes = 5 * 1024 * 1024;
    const statusBox = document.getElementById('status-box');
    const form = document.getElementById('verification-form');
    const message = document.getElementById('message');
    let verificationStatus = null;
    let statusLoadError = '';

    function renderStatus() {
      if (statusLoadError) {
        statusBox.textContent = `Could not check verification status. ${statusLoadError}`;
        return;
      }
      if (!verificationStatus) {
        statusBox.innerHTML = '<strong>Verification status:</strong> Not submitted yet. You can apply to become a verified seller.';
        return;
      }

      if (verificationStatus.status === 'approved') {
        statusBox.innerHTML = '<strong>Verification status:</strong> Approved. Your profile is verified and you can access the full selling benefits.';
        return;
      }

      if (verificationStatus.status === 'pending') {
        statusBox.innerHTML = '<strong>Verification status:</strong> Pending admin approval. You are still limited to a basic selling level until approval is complete.';
        return;
      }

      statusBox.innerHTML = '<strong>Verification status:</strong> Rejected. Please update your details and resubmit, or ask the admin for more guidance.';
    }

    async function refreshVerificationStatus() {
      if (!apiBaseUrl) {
        statusLoadError = 'The API URL is not configured.';
        renderStatus();
        return;
      }
      try {
        const response = await fetch(`${apiBaseUrl}/api/seller-verifications/status?email=${encodeURIComponent(currentUser.email)}`);
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || `The API returned ${response.status}.`);
        verificationStatus = result.status || null;
        statusLoadError = '';
      } catch (error) {
        statusLoadError = error.message || 'Check your internet connection and try again.';
      }
      renderStatus();
    }

    function readDocument(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.addEventListener('load', () => resolve(reader.result));
        reader.addEventListener('error', () => reject(new Error('The selected document could not be read.')));
        reader.readAsDataURL(file);
      });
    }

    function getDocumentType(file) {
      const allowedTypes = ['application/pdf', 'image/jpeg', 'image/png', 'image/gif', 'image/webp'];
      if (allowedTypes.includes(file.type.toLowerCase())) return file.type.toLowerCase();
      const extension = file.name.split('.').pop().toLowerCase();
      return ({
        pdf: 'application/pdf',
        jpg: 'image/jpeg',
        jpeg: 'image/jpeg',
        png: 'image/png',
        gif: 'image/gif',
        webp: 'image/webp'
      })[extension] || '';
    }

    document.getElementById('full-name').value = currentUser.fullname || '';
    document.getElementById('phone-number').value = currentUser.phone || '';
    document.getElementById('email-address').value = currentUser.email || '';

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const data = new FormData(form);
      const file = data.get('document');
      if (!file || file.size <= 0) {
        message.textContent = 'Please upload a supporting document.';
        return;
      }
      if (file.size > maxDocumentSizeBytes) {
        message.textContent = 'Choose a supporting document no larger than 5 MB.';
        return;
      }
      const documentType = getDocumentType(file);
      if (!['application/pdf', 'image/jpeg', 'image/png', 'image/gif', 'image/webp'].includes(documentType)) {
        message.textContent = 'Upload a PDF, JPEG, PNG, GIF, or WebP supporting document.';
        return;
      }
      await refreshVerificationStatus();
      if (statusLoadError) {
        message.textContent = `Could not submit the request. ${statusLoadError}`;
        return;
      }
      if (verificationStatus?.status === 'approved') {
        message.textContent = 'This account is already approved as a verified seller.';
        return;
      }

      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      message.textContent = 'Submitting verification request...';
      try {
        const response = await fetch(`${apiBaseUrl}/api/seller-verifications`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: currentUser.email,
            fullName: String(data.get('fullName') || '').trim(),
            shopName: String(data.get('shopName') || '').trim(),
            phone: String(data.get('phone') || '').trim(),
            notes: String(data.get('notes') || '').trim(),
            documentName: file.name,
            documentType,
            documentData: await readDocument(file)
          })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || `The API returned ${response.status}.`);
        verificationStatus = result.status;
        statusLoadError = '';
        renderStatus();
        message.textContent = 'Your verification request was submitted. The status will update here after admin review.';
        form.reset();
        document.getElementById('full-name').value = currentUser.fullname || '';
        document.getElementById('phone-number').value = currentUser.phone || '';
        document.getElementById('email-address').value = currentUser.email || '';
      } catch (error) {
        message.textContent = `Your verification request was not submitted. ${error.message || 'Check the API connection and try again.'}`;
      } finally {
        submitButton.disabled = false;
      }
    });

    refreshVerificationStatus();
    window.addEventListener('focus', refreshVerificationStatus);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) refreshVerificationStatus();
    });
    window.setInterval(() => {
      if (!document.hidden) refreshVerificationStatus();
    }, 30000);
  </script>
</body>
</html>
